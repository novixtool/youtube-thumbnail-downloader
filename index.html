<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YouTube Thumbnail Downloader</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    min-height:100vh;
    background:#080808;
    color:#fff;
    display:flex;
    justify-content:center;
    padding:25px 15px;
}

.container{
    width:100%;
    max-width:600px;
}

/* Header */

.header{
    text-align:center;
    margin:20px 0 25px;
}

.logo{
    width:70px;
    height:70px;
    margin:auto;
    border-radius:20px;
    background:#ff0000;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    box-shadow:0 10px 30px rgba(255,0,0,.3);
}

h1{
    margin-top:17px;
    font-size:28px;
}

.header p{
    color:#999;
    margin-top:8px;
    font-size:14px;
}

/* Card */

.card{
    background:#151515;
    border:1px solid #292929;
    border-radius:22px;
    padding:20px;
}

/* Input */

.input{
    width:100%;
    height:55px;
    background:#0d0d0d;
    border:1px solid #333;
    border-radius:12px;
    color:#fff;
    padding:0 15px;
    font-size:15px;
    outline:none;
}

.input:focus{
    border-color:#ff0000;
}

/* Main Button */

.get{
    width:100%;
    height:54px;
    margin-top:12px;
    border:0;
    border-radius:12px;
    background:#ff0000;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.get:active{
    transform:scale(.98);
}

/* Error */

.error{
    display:none;
    background:#2a1010;
    color:#ff7777;
    border:1px solid #4a2020;
    border-radius:10px;
    padding:12px;
    text-align:center;
    margin-top:12px;
    font-size:14px;
}

/* Result */

.result{
    display:none;
    margin-top:22px;
}

.label{
    color:#aaa;
    font-size:14px;
    margin-bottom:10px;
}

/* Preview */

.preview{
    width:100%;
    background:#000;
    border-radius:14px;
    overflow:hidden;
    border:1px solid #333;
}

.preview img{
    display:block;
    width:100%;
    height:auto;
}

/* Quality */

.quality{
    display:flex;
    gap:10px;
    margin-top:14px;
}

.quality button{
    flex:1;
    height:44px;
    background:#222;
    border:1px solid #383838;
    color:#ccc;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.quality button.active{
    background:#ff0000;
    border-color:#ff0000;
    color:#fff;
}

/* Download */

.download{
    width:100%;
    height:56px;
    margin-top:14px;
    border:0;
    border-radius:12px;
    background:#19a34a;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 7px 20px rgba(25,163,74,.18);
}

.download:active{
    transform:scale(.98);
}

/* Copy */

.copy{
    width:100%;
    height:48px;
    margin-top:10px;
    border:1px solid #3b3b3b;
    border-radius:12px;
    background:#222;
    color:white;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

/* Info */

.info{
    text-align:center;
    color:#777;
    font-size:12px;
    margin-top:18px;
    line-height:1.5;
}

/* Footer */

.footer{
    text-align:center;
    color:#555;
    font-size:12px;
    margin-top:18px;
}

/* Mobile */

@media(max-width:480px){

    body{
        padding:15px 10px;
    }

    .card{
        padding:16px;
    }

    h1{
        font-size:24px;
    }

    .logo{
        width:62px;
        height:62px;
        font-size:28px;
    }

}
</style>
</head>


<body>

<div class="container">

    <div class="header">

        <div class="logo">▶</div>

        <h1>YouTube Thumbnail</h1>

        <p>
            Download YouTube thumbnails in high quality
        </p>

    </div>


    <div class="card">

        <input
            id="url"
            class="input"
            type="text"
            placeholder="Paste YouTube video link..."
        >

        <button class="get" onclick="getThumbnail()">
            🔍 Get Thumbnail
        </button>


        <div id="error" class="error"></div>


        <div id="result" class="result">

            <div class="label">
                Thumbnail Preview
            </div>


            <div class="preview">

                <img
                    id="thumbnail"
                    src=""
                    alt="YouTube Thumbnail"
                >

            </div>


            <div class="quality">

                <button
                    id="hd"
                    class="active"
                    onclick="setQuality('hd')">
                    HD Quality
                </button>

                <button
                    id="hq"
                    onclick="setQuality('hq')">
                    HQ Quality
                </button>

            </div>


            <button
                class="download"
                onclick="downloadImage()">
                ⬇️ DOWNLOAD THUMBNAIL
            </button>


            <button
                id="copy"
                class="copy"
                onclick="copyURL()">
                📋 Copy Thumbnail URL
            </button>

        </div>


        <div class="info">
            Supports YouTube videos, Shorts and youtu.be links.
        </div>

    </div>


    <div class="footer">
        © 2026 YouTube Thumbnail Downloader
    </div>

</div>


<script>

let videoID = "";
let quality = "hd";
let imageURL = "";


/* -------------------------
   GET VIDEO ID
------------------------- */

function getVideoID(url){

    try{

        const u = new URL(url);
        const host = u.hostname.toLowerCase();

        /* youtube.com/watch?v= */

        if(
            host === "youtube.com" ||
            host === "www.youtube.com" ||
            host === "m.youtube.com"
        ){

            let id = u.searchParams.get("v");

            if(id){
                return id;
            }


            /* Shorts */

            if(u.pathname.startsWith("/shorts/")){

                return u.pathname
                    .split("/shorts/")[1]
                    .split("/")[0];

            }


            /* Embed */

            if(u.pathname.startsWith("/embed/")){

                return u.pathname
                    .split("/embed/")[1]
                    .split("/")[0];

            }

        }


        /* youtu.be */

        if(host === "youtu.be"){

            return u.pathname
                .substring(1)
                .split("/")[0];

        }

        return null;

    }catch(e){

        return null;

    }

}


/* -------------------------
   GET THUMBNAIL
------------------------- */

function getThumbnail(){

    const input =
        document.getElementById("url");

    const error =
        document.getElementById("error");

    const result =
        document.getElementById("result");

    const img =
        document.getElementById("thumbnail");


    const url =
        input.value.trim();


    error.style.display = "none";

    result.style.display = "none";


    if(!url){

        showError("❌ YouTube link paste karo.");

        return;

    }


    videoID =
        getVideoID(url);


    if(!videoID){

        showError("❌ Valid YouTube link nahi mili.");

        return;

    }


    quality = "hd";

    document.getElementById("hd")
        .classList.add("active");

    document.getElementById("hq")
        .classList.remove("active");


    imageURL =
        "https://img.youtube.com/vi/" +
        videoID +
        "/maxresdefault.jpg";


    img.src = imageURL;


    img.onload = function(){

        result.style.display = "block";

    };


    img.onerror = function(){

        /* HD available nahi hai */

        quality = "hq";

        document.getElementById("hd")
            .classList.remove("active");

        document.getElementById("hq")
            .classList.add("active");


        imageURL =
            "https://img.youtube.com/vi/" +
            videoID +
            "/hqdefault.jpg";


        img.src = imageURL;


        result.style.display = "block";

    };

}


/* -------------------------
   QUALITY
------------------------- */

function setQuality(type){

    if(!videoID){
        return;
    }


    quality = type;


    const img =
        document.getElementById("thumbnail");


    if(type === "hd"){

        imageURL =
            "https://img.youtube.com/vi/" +
            videoID +
            "/maxresdefault.jpg";


        document.getElementById("hd")
            .classList.add("active");

        document.getElementById("hq")
            .classList.remove("active");

    }else{

        imageURL =
            "https://img.youtube.com/vi/" +
            videoID +
            "/hqdefault.jpg";


        document.getElementById("hq")
            .classList.add("active");

        document.getElementById("hd")
            .classList.remove("active");

    }


    img.src = imageURL;

}


/* -------------------------
   DOWNLOAD
------------------------- */

function downloadImage(){

    if(!imageURL){
        return;
    }


    /*
       Open image in a new tab.

       This is more reliable on mobile browsers
       than forcing a cross-origin download.
    */

    const newTab =
        window.open(imageURL, "_blank");


    if(!newTab){

        alert(
            "Download ke liye browser mein image open karo."
        );

    }

}


/* -------------------------
   COPY URL
------------------------- */

async function copyURL(){

    if(!imageURL){
        return;
    }


    try{

        await navigator.clipboard
            .writeText(imageURL);


        const button =
            document.getElementById("copy");


        button.innerText =
            "✅ URL Copied!";


        setTimeout(function(){

            button.innerText =
                "📋 Copy Thumbnail URL";

        },1500);


    }catch(e){

        alert(
            "URL copy nahi ho paya."
        );

    }

}


/* -------------------------
   ERROR
------------------------- */

function showError(message){

    const error =
        document.getElementById("error");


    error.innerText = message;

    error.style.display = "block";

}


/* -------------------------
   ENTER KEY
------------------------- */

document
    .getElementById("url")
    .addEventListener("keydown", function(e){

        if(e.key === "Enter"){

            getThumbnail();

        }

    });

</script>

</body>
    </html>
