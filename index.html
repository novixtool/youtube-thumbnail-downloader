<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Thumbnail Downloader - Pro</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

  :root {
    --bg: #0f0f1a;
    --card: #1a1a2e;
    --card2: #16213e;
    --accent: #ff0055;
    --accent2: #ff4d6d;
    --text: #ffffff;
    --text-muted: #a0a0b8;
    --border: #2a2a45;
    --success: #00d97e;
  }

  body.light {
    --bg: #f0f2f5;
    --card: #ffffff;
    --card2: #f8f9fb;
    --accent: #ff0055;
    --accent2: #ff4d6d;
    --text: #1a1a2e;
    --text-muted: #666;
    --border: #e0e0e8;
  }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    transition: 0.3s;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,0,85,0.08), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(0,217,126,0.06), transparent 40%);
  }

  /* HEADER */
  header {
    max-width: 900px;
    margin: 0 auto 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 20px;
    background: var(--card);
    border-radius: 16px;
    border: 1px solid var(--border);
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: bold;
  }

  .logo-icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }

  .logo span { background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

  .theme-toggle {
    background: var(--card2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 44px; height: 44px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
    transition: 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .theme-toggle:hover { transform: rotate(20deg) scale(1.1); }

  /* MAIN CONTAINER */
  .container {
    max-width: 900px;
    margin: 0 auto;
    background: var(--card);
    border-radius: 20px;
    padding: 30px;
    border: 1px solid var(--border);
    box-shadow: 0 15px 50px rgba(0,0,0,0.35);
  }

  .hero { text-align: center; margin-bottom: 25px; }
  .hero h1 {
    font-size: 28px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero p { color: var(--text-muted); font-size: 14px; }

  /* INPUT */
  .input-group {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
    flex-wrap: wrap;
  }

  .input-wrapper {
    flex: 1;
    position: relative;
    min-width: 250px;
  }

  .input-wrapper input {
    width: 100%;
    padding: 15px 45px 15px 45px;
    background: var(--card2);
    border: 2px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: 0.3s;
  }

  .input-wrapper input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(255,0,85,0.15);
  }

  .input-wrapper .icon-left {
    position: absolute;
    left: 15px; top: 50%;
    transform: translateY(-50%);
    font-size: 18px;
    opacity: 0.6;
  }

  .paste-btn {
    position: absolute;
    right: 8px; top: 50%;
    transform: translateY(-50%);
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
    transition: 0.3s;
  }
  .paste-btn:hover { background: var(--accent2); }

  .search-btn {
    padding: 15px 30px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    white-space: nowrap;
  }

  .search-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,0,85,0.4); }
  .search-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  /* ERROR */
  .error {
    background: rgba(255,0,85,0.1);
    border: 1px solid rgba(255,0,85,0.3);
    color: var(--accent);
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 14px;
    margin-bottom: 15px;
    display: none;
    text-align: center;
  }

  /* LOADER */
  .loader {
    display: none;
    text-align: center;
    padding: 20px;
  }

  .spinner {
    width: 45px; height: 45px;
    border: 4px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* RESULTS */
  .results { display: none; }

  .video-info {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 15px;
    background: var(--card2);
    border-radius: 12px;
    margin-bottom: 20px;
    border: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .video-info .vid-icon {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .video-info .vid-text { flex: 1; min-width: 150px; }
  .video-info .vid-text .label { font-size: 12px; color: var(--text-muted); }
  .video-info .vid-text .id { font-family: monospace; font-size: 14px; font-weight: bold; word-break: break-all; }

  /* GRID */
  .grid-title {
    font-size: 16px;
    margin-bottom: 15px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .thumb-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
  }

  .thumb-card {
    background: var(--card2);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    transition: 0.3s;
  }

  .thumb-card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 10px 30px rgba(255,0,85,0.2);
  }

  .thumb-card .img-wrap {
    position: relative;
    aspect-ratio: 16/9;
    background: #000;
    overflow: hidden;
  }

  .thumb-card img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  .quality-badge {
    position: absolute;
    top: 8px; left: 8px;
    background: rgba(0,0,0,0.75);
    color: #fff;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: bold;
    backdrop-filter: blur(5px);
  }

  .thumb-card .card-body {
    padding: 12px;
  }

  .thumb-card .card-body .res-info {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .btn-group {
    display: flex;
    gap: 8px;
  }

  .btn {
    flex: 1;
    padding: 9px;
    border: none;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }

  .btn-download {
    background: var(--success);
    color: #fff;
  }
  .btn-download:hover { background: #00b366; }

  .btn-copy {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-copy:hover { border-color: var(--accent); color: var(--accent); }

  /* BATCH */
  .batch-section {
    background: var(--card2);
    border: 1px dashed var(--accent);
    border-radius: 12px;
    padding: 15px;
    margin-top: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .batch-section .batch-text {
    font-size: 14px;
    color: var(--text-muted);
  }
  .batch-section .batch-text strong { color: var(--text); }

  .btn-batch {
    padding: 12px 20px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }
  .btn-batch:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,0,85,0.4); }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 25px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--card);
    color: var(--text);
    padding: 14px 24px;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    font-size: 14px;
    font-weight: bold;
    transition: 0.4s;
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--success); }
  .toast.error { border-color: var(--accent); }

  /* FOOTER */
  footer {
    text-align: center;
    margin-top: 25px;
    color: var(--text-muted);
    font-size: 13px;
  }

  /* MOBILE */
  @media (max-width: 600px) {
    .container { padding: 20px; }
    .hero h1 { font-size: 22px; }
    .search-btn { width: 100%; }
    .input-wrapper input { padding-left: 42px; }
    .logo { font-size: 16px; }
    .logo-icon { width: 32px; height: 32px; font-size: 16px; }
  }
</style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo">
      <div class="logo-icon">🎬</div>
      <span>ThumbnailPro</span>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn" title="Toggle Theme">🌙</button>
  </header>

  <!-- MAIN -->
  <div class="container">
    <div class="hero">
      <h1>YouTube Thumbnail Downloader</h1>
      <p>HD, SD, MQ — sabhi quality mein thumbnail download karein</p>
    </div>

    <!-- INPUT -->
    <div class="input-group">
      <div class="input-wrapper">
        <span class="icon-left">🔗</span>
        <input type="text" id="ytLink" placeholder="YouTube link yahan paste karein..." />
        <button class="paste-btn" onclick="pasteLink()">Paste</button>
      </div>
      <button class="search-btn" id="searchBtn" onclick="getThumbnails()">🔍 Get Thumbnails</button>
    </div>

    <!-- ERROR -->
    <div class="error" id="error"></div>

    <!-- LOADER -->
    <div class="loader" id="loader">
      <div class="spinner"></div>
      <p style="color: var(--text-muted); font-size: 13px;">Thumbnails fetch ho rahi hain...</p>
    </div>

    <!-- RESULTS -->
    <div class="results" id="results">
      <div class="video-info">
        <div class="vid-icon">🎥</div>
        <div class="vid-text">
          <div class="label">Video ID</div>
          <div class="id" id="videoIdText">-</div>
        </div>
      </div>

      <div class="grid-title">📸 Available Thumbnails</div>
      <div class="thumb-grid" id="thumbGrid"></div>

      <div class="batch-section">
        <div class="batch-text">
          <strong>💡 Tip:</strong> Ek click mein sabhi thumbnails download karein
        </div>
        <button class="btn-batch" onclick="downloadAll()">⬇️ Download All</button>
      </div>
    </div>
  </div>

  <footer>
    Made with ❤️ | ThumbnailPro © 2025
  </footer>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

<script>
  let currentVideoId = '';
  let availableThumbs = [];

  // ================= THEME TOGGLE =================
  function toggleTheme() {
    document.body.classList.toggle('light');
    const isLight = document.body.classList.contains('light');
    document.getElementById('themeBtn').textContent = isLight ? '☀️' : '🌙';
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
  }

  // Load saved theme
  if (localStorage.getItem('theme') === 'light') {
    document.body.classList.add('light');
    document.getElementById('themeBtn').textContent = '☀️';
  }

  // ================= PASTE BUTTON =================
  async function pasteLink() {
    try {
      const text = await navigator.clipboard.readText();
      document.getElementById('ytLink').value = text;
      showToast('📋 Link paste ho gaya!', 'success');
    } catch (err) {
      showToast('❌ Clipboard access nahi mila', 'error');
    }
  }

  // ================= TOAST =================
  function showToast(msg, type = 'success') {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast show ' + type;
    setTimeout(() => {
      toast.className = 'toast ' + type;
    }, 2500);
  }

  // ================= EXTRACT VIDEO ID =================
  function extractVideoId(url) {
    const patterns = [
      /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/v\/|youtube\.com\/shorts\/|youtube\.com\/live\/)([^&?\/\s]{11})/,
      /^([a-zA-Z0-9_-]{11})$/
    ];
    for (let pattern of patterns) {
      const match = url.match(pattern);
      if (match) return match[1];
    }
    return null;
  }

  // ================= GET THUMBNAILS =================
  async function getThumbnails() {
    const url = document.getElementById('ytLink').value.trim();
    const errorDiv = document.getElementById('error');
    const resultsDiv = document.getElementById('results');
    const loader = document.getElementById('loader');
    const searchBtn = document.getElementById('searchBtn');

    errorDiv.style.display = 'none';
    resultsDiv.style.display = 'none';

    if (!url) {
      errorDiv.textContent = '⚠️ Kripya YouTube link daalein!';
      errorDiv.style.display = 'block';
      return;
    }

    currentVideoId = extractVideoId(url);

    if (!currentVideoId) {
      errorDiv.textContent = '❌ Invalid YouTube link! Sahi link daalein.';
      errorDiv.style.display = 'block';
      return;
    }

    // Show loader
    loader.style.display = 'block';
    searchBtn.disabled = true;

    // Quality list
    const qualities = [
      { name: 'Max Resolution', code: 'maxresdefault', res: '1280x720', badge: 'HD MAX' },
      { name: 'Standard Definition', code: 'sddefault', res: '640x480', badge: 'SD' },
      { name: 'High Quality', code: 'hqdefault', res: '480x360', badge: 'HQ' },
      { name: 'Medium Quality', code: 'mqdefault', res: '320x180', badge: 'MQ' },
      { name: 'Default', code: 'default', res: '120x90', badge: 'LOW' },
    ];

    availableThumbs = [];
    const grid = document.getElementById('thumbGrid');
    grid.innerHTML = '';

    // Check which thumbnails exist
    for (const q of qualities) {
      const thumbUrl = `https://img.youtube.com/vi/${currentVideoId}/${q.code}.jpg`;
      const exists = await checkImage(thumbUrl);
      if (exists) {
        availableThumbs.push({ ...q, url: thumbUrl });
      }
    }

    // Render
    if (availableThumbs.length === 0) {
      loader.style.display = 'none';
      searchBtn.disabled = false;
      errorDiv.textContent = '❌ Koi thumbnail nahi mili is video ke liye.';
      errorDiv.style.display = 'block';
      return;
    }

    availableThumbs.forEach(q => {
      const card = document.createElement('div');
      card.className = 'thumb-card';
      card.innerHTML = `
        <div class="img-wrap">
          <img src="${q.url}" alt="${q.name}" loading="lazy">
          <div class="quality-badge">${q.badge}</div>
        </div>
        <div class="card-body">
          <div class="res-info">
            <span>📐 ${q.res}</span>
            <span>${q.name}</span>
          </div>
          <div class="btn-group">
            <button class="btn btn-download" onclick="downloadThumb('${q.url}', '${currentVideoId}', '${q.code}')">
              ⬇️ Download
            </button>
            <button class="btn btn-copy" onclick="copyUrl('${q.url}')">
              📋 Copy
            </button>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });

    document.getElementById('videoIdText').textContent = currentVideoId;
    loader.style.display = 'none';
    resultsDiv.style.display = 'block';
    searchBtn.disabled = false;
    showToast('✅ Thumbnails mil gayi!', 'success');
  }

  // ================= CHECK IMAGE EXISTS =================
  function checkImage(url) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => resolve(img.width > 120); // 120x90 placeholder ignore
      img.onerror = () => resolve(false);
      img.src = url;
    });
  }

  // ================= DOWNLOAD THUMB =================
  async function downloadThumb(url, videoId, code) {
    showToast('⏳ Download ho raha hai...', 'success');
    try {
      const response = await fetch(url, { mode: 'cors' });
      const blob = await response.blob();
      triggerDownload(blob, `thumbnail_${videoId}_${code}.jpg`);
      showToast('✅ Download complete!', 'success');
    } catch (err) {
      // Fallback: new tab
      window.open(url, '_blank');
      showToast('📂 Naye tab mein khula - right click karke save karein', 'success');
    }
  }

  // ================= TRIGGER DOWNLOAD =================
  function triggerDownload(blob, filename) {
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
  }

  // ================= COPY URL =================
  async function copyUrl(url) {
    try {
      await navigator.clipboard.writeText(url);
      showToast('📋 URL copy ho gaya!', 'success');
    } catch (err) {
      showToast('❌ Copy nahi ho paya', 'error');
    }
  }

  // ================= DOWNLOAD ALL =================
  async function downloadAll() {
    if (availableThumbs.length === 0) return;
    showToast(`⏳ ${availableThumbs.length} thumbnails download ho rahi hain...`, 'success');

    for (let i = 0; i < availableThumbs.length; i++) {
      const q = availableThumbs[i];
      setTimeout(async () => {
        try {
          const response = await fetch(q.url, { mode: 'cors' });
          const blob = await response.blob();
          triggerDownload(blob, `thumbnail_${currentVideoId}_${q.code}.jpg`);
        } catch (err) {
          window.open(q.url, '_blank');
        }
      }, i * 400);
    }

    setTimeout(() => showToast('✅ Sabhi downloads complete!', 'success'), availableThumbs.length * 400 + 500);
  }

  // ================= ENTER KEY =================
  document.getElementById('ytLink').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') getThumbnails();
  });
</script>
</body>
</html>
