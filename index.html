<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Thumbnail Downloader</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #1e1e2f, #2b2b45);
    padding: 20px;
  }
  .container {
    background: #fff;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 550px;
    text-align: center;
  }
  h1 {
    color: #ff0000;
    margin-bottom: 10px;
    font-size: 24px;
  }
  p { color: #666; margin-bottom: 20px; font-size: 14px; }
  input {
    width: 100%;
    padding: 14px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
    margin-bottom: 15px;
    outline: none;
    transition: 0.3s;
  }
  input:focus { border-color: #ff0000; }
  button {
    width: 100%;
    padding: 14px;
    background: #ff0000;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }
  button:hover { background: #cc0000; }
  button:disabled { background: #999; cursor: not-allowed; }
  .preview {
    margin-top: 20px;
    display: none;
  }
  .preview img {
    width: 100%;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }
  .download-btn {
    margin-top: 15px;
    background: #28a745;
  }
  .download-btn:hover { background: #1e7e34; }
  .error {
    color: #ff0000;
    margin-top: 15px;
    font-size: 14px;
    display: none;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>🎬 YouTube Thumbnail Downloader</h1>
    <p>YouTube video ka link paste karein aur thumbnail download karein</p>

    <input type="text" id="ytLink" placeholder="https://www.youtube.com/watch?v=..." />
    <button onclick="getThumbnail()">Get Thumbnail</button>

    <div class="error" id="error"></div>

    <div class="preview" id="preview">
      <img id="thumbImg" src="" alt="Thumbnail" />
      <button class="download-btn" onclick="downloadThumb()">⬇️ Download Thumbnail</button>
    </div>
  </div>

<script>
  let currentThumbUrl = '';
  let videoId = '';

  // YouTube link se Video ID nikalne ka function
  function extractVideoId(url) {
    const patterns = [
      /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/v\/|youtube\.com\/shorts\/)([^&?\/\s]{11})/,
      /^([^&?\/\s]{11})$/
    ];
    for (let pattern of patterns) {
      const match = url.match(pattern);
      if (match) return match[1];
    }
    return null;
  }

  function getThumbnail() {
    const url = document.getElementById('ytLink').value.trim();
    const errorDiv = document.getElementById('error');
    const previewDiv = document.getElementById('preview');

    errorDiv.style.display = 'none';
    previewDiv.style.display = 'none';

    if (!url) {
      errorDiv.textContent = '⚠️ Kripya YouTube link daalein!';
      errorDiv.style.display = 'block';
      return;
    }

    videoId = extractVideoId(url);

    if (!videoId) {
      errorDiv.textContent = '❌ Invalid YouTube link! Sahi link daalein.';
      errorDiv.style.display = 'block';
      return;
    }

    // Max resolution thumbnail
    currentThumbUrl = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;

    const img = document.getElementById('thumbImg');
    img.src = currentThumbUrl;

    img.onerror = function() {
      // Agar maxres nahi mili to hdquality try karo
      currentThumbUrl = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
      img.src = currentThumbUrl;
    };

    img.onload = function() {
      previewDiv.style.display = 'block';
    };
  }

  async function downloadThumb() {
    if (!currentThumbUrl) return;

    try {
      const response = await fetch(currentThumbUrl);
      const blob = await response.blob();
      const blobUrl = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = `thumbnail_${videoId}.jpg`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(blobUrl);
    } catch (err) {
      // Agar fetch fail ho (CORS), to direct open karo
      window.open(currentThumbUrl, '_blank');
    }
  }

  // Enter key se bhi search ho jaye
  document.getElementById('ytLink').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') getThumbnail();
  });
</script>
</body>
</html>
